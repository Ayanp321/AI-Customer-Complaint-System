<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tickets - ResolverAI</title>
    <link rel="stylesheet" href="/frontend/css/style.css">
    <link rel="stylesheet" href="/frontend/css/dashboard.css">
    <link rel="stylesheet" href="/frontend/css/complaint.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <a href="/frontend/index.html" class="nav-brand">
            <div class="brand-logo"><i class="fas fa-brain"></i></div>
            <span>ResolverAI</span>
        </a>
        <ul class="nav-links">
            <li><a href="/frontend/customer/dashboard.html" class="nav-link"><i class="fas fa-chart-line"></i> Dashboard</a></li>
            <li><a href="/frontend/customer/create-complaint.html" class="nav-link"><i class="fas fa-plus-circle"></i> File Complaint</a></li>
            <li><a href="/frontend/customer/complaints.html" class="nav-link active"><i class="fas fa-list-ul"></i> My Tickets</a></li>
        </ul>
        <div id="userProfileNav"></div>
    </nav>

    <main class="container">
        <div class="dashboard-header">
            <div class="dashboard-title">
                <h1>My Complaint Tickets</h1>
                <p>View history, monitor live status, and access resolution receipts.</p>
            </div>
            <a href="/frontend/customer/create-complaint.html" class="btn btn-primary">
                <i class="fas fa-plus"></i> New Complaint
            </a>
        </div>

        <div class="card">
            <!-- Filter Bar -->
            <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
                <div style="flex: 2; min-width: 240px;">
                    <input type="text" id="searchComplaintInput" class="form-control" placeholder="Search ticket ID, subject, keyword...">
                </div>
                <div style="flex: 1; min-width: 160px;">
                    <select id="statusFilterSelect" class="form-select">
                        <option value="All">All Statuses</option>
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Resolved">Resolved</option>
                    </select>
                </div>
                <div style="flex: 1; min-width: 160px;">
                    <select id="categoryFilterSelect" class="form-select">
                        <option value="All">All Categories</option>
                        <option value="Billing">Billing</option>
                        <option value="Technical">Technical</option>
                        <option value="Delivery">Delivery</option>
                        <option value="Service">Service</option>
                    </select>
                </div>
            </div>

            <!-- Table -->
            <div class="table-container">
                <table class="complaint-table">
                    <thead>
                        <tr>
                            <th>Ticket ID</th>
                            <th>Subject</th>
                            <th>Category</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="customerComplaintsFullTable">
                        <!-- Rendered by customer.js -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ResolverAI System - Customer Portal</p>
    </footer>

    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/auth.js"></script>
    <script src="/frontend/js/customer.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.auth.requireRole('customer');
        });
    </script>
</body>
</html>

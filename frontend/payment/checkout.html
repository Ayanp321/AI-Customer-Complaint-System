<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Refund Payout - ResolverAI</title>
    <link rel="stylesheet" href="/frontend/css/style.css">
    <link rel="stylesheet" href="/frontend/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <a href="/frontend/index.html" class="nav-brand">
            <div class="brand-logo"><i class="fas fa-brain"></i></div>
            <span>ResolverAI Payout Portal</span>
        </a>
        <ul class="nav-links">
            <li><a href="/frontend/customer/dashboard.html" class="nav-link"><i class="fas fa-arrow-left"></i> Customer Dashboard</a></li>
        </ul>
        <div id="userProfileNav"></div>
    </nav>

    <main class="container" style="max-width: 600px; padding-top: 3rem;">
        <div class="card">
            <div style="text-align: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1.25rem;">
                <div class="stat-icon success" style="margin: 0 auto 1rem auto; width: 64px; height: 64px; font-size: 2rem;">
                    <i class="fas fa-hand-holding-usd"></i>
                </div>
                <h1 style="font-size: 1.5rem; font-weight: 800;">Claim Approved Refund Payout</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Enter your payout card details below to receive direct compensation credit.</p>
            </div>

            <!-- Refund Summary Box -->
            <div style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 1.25rem; margin-bottom: 1.5rem;">
                <div class="flex-between" style="margin-bottom: 0.5rem;">
                    <span class="text-muted">Associated Ticket ID:</span>
                    <strong id="checkoutTicketId" class="ticket-id">TICK-XXXX</strong>
                </div>
                <div class="flex-between" style="margin-bottom: 0.75rem;">
                    <span class="text-muted">Issue Subject:</span>
                    <span id="checkoutSubject" style="font-size: 0.9rem; font-weight: 600;">--</span>
                </div>
                <div class="flex-between" style="border-top: 1px dashed var(--border-color); padding-top: 0.75rem; font-size: 1.1rem;">
                    <strong>Approved Refund Payout:</strong>
                    <strong id="checkoutRefundAmount" style="color: var(--success); font-size: 1.4rem;">$0.00</strong>
                </div>
            </div>

            <!-- Payout Card Form -->
            <form id="paymentForm">
                <div class="form-group">
                    <label class="form-label">Account Holder Name</label>
                    <input type="text" id="cardNameInput" class="form-control" placeholder="Aarav Sharma" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Card / Account Number</label>
                    <div style="position: relative;">
                        <input type="text" id="cardNumberInput" class="form-control" placeholder="4532 •••• •••• 8892" required>
                        <i class="fas fa-credit-card" style="position: absolute; right: 1rem; top: 1rem; color: var(--text-muted);"></i>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">Expiry (MM/YY)</label>
                        <input type="text" id="cardExpiryInput" class="form-control" placeholder="12/28" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">CVC / Security Code</label>
                        <input type="password" id="cardCvcInput" class="form-control" placeholder="•••" maxLength="4" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-success btn-lg btn-full" style="margin-top: 1rem;">
                    <i class="fas fa-lock"></i> Process Refund Payout Now
                </button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ResolverAI System - Secure Financial Payout Portal</p>
    </footer>

    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/auth.js"></script>
    <script src="/frontend/js/payment.js"></script>
</body>
</html>

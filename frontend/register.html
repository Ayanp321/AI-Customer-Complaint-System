<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - AI Customer Complaint System</title>
    <link rel="stylesheet" href="/frontend/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="justify-content: center; align-items: center; min-height: 100vh;">
    <div style="width: 100%; max-width: 440px; padding: 1.5rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <a href="/frontend/index.html" class="nav-brand" style="justify-content: center; margin-bottom: 0.75rem;">
                <div class="brand-logo"><i class="fas fa-brain"></i></div>
                <span>ResolverAI</span>
            </a>
            <h2 style="font-size: 1.5rem; font-weight: 700;">Create Customer Account</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Register to submit and track your complaints</p>
        </div>

        <div class="card">
            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="regName" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="john.doe@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top: 1rem;">
                    Create Account <i class="fas fa-user-plus"></i>
                </button>
            </form>
        </div>

        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            Already have an account? <a href="/frontend/login.html">Sign In</a>
        </p>
    </div>

    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            const res = window.auth.register(name, email, password, 'customer');
            if (res.success) {
                window.location.href = '/frontend/customer/dashboard.html';
            } else {
                alert(res.message);
            }
        });
    </script>
</body>
</html>
